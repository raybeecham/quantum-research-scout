timezone: America/Chicago

scope_note: >-
  Named, cross-agency or cross-sector federal science and technology missions, initiatives, and
  national efforts relevant to quantum technology, AI, cybersecurity, energy, discovery science,
  and national security. Routine agency mission statements and unrelated operational missions are
  excluded.

discovery:
  recent_launch_days: 365
  candidate_retention_days: 730

missions:
  - id: genesis-mission
    name: Genesis Mission
    kind: national mission
    status: active
    phase: execution
    priority: critical
    announcement_date: 2025-11-24
    aliases:
      - Genesis Mission
      - American Science and Security Platform
    lead_agencies:
      - Department of Energy
      - White House Office of Science and Technology Policy
    partners:
      - 17 DOE National Laboratories
      - National Science and Technology Council
      - Industry
      - Academia
      - Philanthropic organizations
      - International research partners
    domains:
      - Artificial intelligence
      - Quantum information science
      - High-performance computing
      - Energy
      - Discovery science
      - National security
    objective: >-
      Build an integrated American Science and Security Platform connecting federal scientific
      datasets, supercomputers, AI systems, experimental facilities, and emerging quantum systems
      to double the productivity and impact of American research and engineering within a decade.
    official_url: https://www.energy.gov/undersecretaryforscience/genesis-mission/genesis-mission
    related_missions:
      - Quantum Genesis
      - QC-ADDS
    milestones:
      - id: genesis-national-challenges
        title: Identify at least 20 national science and technology challenges
        target_date: 2026-01-23
        date_precision: exact
        status: completed
        summary: DOE subsequently announced a portfolio of 26 challenges.
        source_url: https://www.energy.gov/undersecretaryforscience/articles/energy-department-announces-26-genesis-mission-science-and
      - id: genesis-robotic-lab-review
        title: Review federal robotic and AI-directed laboratory capabilities
        target_date: 2026-07-22
        date_precision: exact
        status: monitoring
        summary: Executive Order 14363 set a 240-day review of robotic laboratories, production facilities, and enabling standards.
        source_url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - id: genesis-initial-operating-capability
        title: Seek initial platform operating capability for at least one national challenge
        target_date: 2026-08-21
        date_precision: exact
        status: monitoring
        summary: Executive Order 14363 set a 270-day objective, subject to law and available appropriations.
        source_url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - id: genesis-first-annual-report
        title: Submit the first annual Genesis Mission progress report
        target_date: 2026-11-24
        date_precision: exact
        status: monitoring
        summary: The report covers platform operations, integration, users, research outcomes, partnerships, and support needs.
        source_url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - id: genesis-decade-goal
        title: Double the productivity and impact of American research and engineering
        target_date: 2035-12-31
        date_precision: year
        status: estimated
        summary: The public goal is stated as within a decade rather than as a fixed statutory deadline.
        source_url: https://genesis.energy.gov/
    updates:
      - date: 2025-11-24
        kind: launch
        title: Executive Order 14363 launches the Genesis Mission
        source: White House
        url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - date: 2026-02-12
        kind: portfolio
        title: DOE announces 26 national science and technology challenges
        source: Department of Energy
        url: https://www.energy.gov/undersecretaryforscience/articles/energy-department-announces-26-genesis-mission-science-and
      - date: 2026-03-17
        kind: funding
        title: DOE announces $293 million for Genesis Mission challenges
        source: Department of Energy
        url: https://www.energy.gov/articles/energy-department-announces-293-million-funding-support-genesis-mission-national-science
      - date: 2026-06-04
        kind: international partnership
        title: United States and Japan announce a $1 billion Genesis Mission partnership
        source: Department of Energy
        url: https://www.energy.gov/articles/united-states-and-japan-announce-historic-1-billion-partnership-under-president-trumps
      - date: 2026-07-22
        kind: execution
        title: DOE reports more than $800 million in partner commitments
        source: Department of Energy
        url: https://www.energy.gov/undersecretaryforscience/articles/us-department-energy-announces-more-800-million-partner

  - id: quantum-genesis
    name: Quantum Genesis
    kind: federal initiative
    status: active
    phase: competition and capability development
    priority: critical
    announcement_date: 2026-06-23
    aliases:
      - Quantum Genesis
      - DOE Q Competition
      - National Quantum Supercomputing User Facility
    lead_agencies:
      - Department of Energy Office of Science
    partners:
      - DOE National Laboratories
      - National Quantum Information Science Research Centers
      - Universities
      - Quantum industry
    domains:
      - Fault-tolerant quantum computing
      - Logical qubits
      - Quantum applications
      - Quantum supercomputing
      - AI and HPC integration
    objective: >-
      Develop and deploy a scientifically relevant, fault-tolerant quantum computing capability
      for research, supported by a DOE Q Competition, a national user facility, and focused
      quantum-application research.
    official_url: https://www.energy.gov/science/articles/energy-department-announces-initiative-create-and-deploy-worlds-first
    parent_mission: Genesis Mission
    related_missions:
      - QC-ADDS
    milestones:
      - id: quantum-genesis-2028-demonstration
        title: Demonstrate fault-tolerant systems with logical qubits in the low hundreds
        target_date: 2028-12-31
        date_precision: year
        status: estimated
        summary: DOE states that the Q Competition aims for a 2028 demonstration.
        source_url: https://www.energy.gov/science/articles/energy-department-announces-initiative-create-and-deploy-worlds-first
    updates:
      - date: 2026-06-23
        kind: launch
        title: DOE establishes the Quantum Genesis initiative
        source: Department of Energy
        url: https://www.energy.gov/science/articles/energy-department-announces-initiative-create-and-deploy-worlds-first

  - id: qc-adds
    name: QC-ADDS
    kind: national effort
    status: active
    phase: specifications and partnership planning
    priority: critical
    announcement_date: 2026-06-22
    aliases:
      - QC-ADDS
      - Quantum Computer for Application Development and Discovery Science
    lead_agencies:
      - White House Office of Science and Technology Policy
      - Department of Energy
    partners:
      - Department of Commerce
      - Department of War
      - National Science Foundation
      - Intelligence Community
      - NASA
      - NSA
      - Quantum industry
    domains:
      - Quantum computing
      - Scientific applications
      - Performance assessment
      - National security
      - Post-quantum cryptography
    objective: >-
      Pursue a quantum computer at a scale intended to initiate quantum-enabled scientific
      discovery, with the intent to deliver at least one system to a DOE facility and make it
      available to the scientific community to the extent possible.
    official_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
    related_missions:
      - Quantum Genesis
      - QuantumEAGLe
    milestones:
      - id: qc-adds-specifications
        title: Publish a summary of QC-ADDS technical specifications
        target_date: 2026-09-20
        date_precision: exact
        status: planned
        summary: DOE must identify specifications for transformative applications beyond current classical capabilities.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - id: qc-adds-partnership-model
        title: Explore private-sector partnership models and commercial contribution plans
        target_date: 2026-12-19
        date_precision: exact
        status: planned
        summary: The work covers potential cost, scope, time frame, and mechanisms such as advance market commitments.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - id: qc-adds-assessment-center
        title: Establish a national quantum-computing assessment center
        target_date: 2026-12-19
        date_precision: exact
        status: planned
        summary: The center is directed to develop tools for accurately assessing quantum-computing systems.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - id: qc-adds-security-report
        title: Report national-security implications of increasing commercial quantum capability
        target_date: 2027-06-22
        date_precision: exact
        status: planned
        summary: The assessment explicitly includes implications for migration to post-quantum cryptography.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
    updates:
      - date: 2026-06-22
        kind: establishment
        title: Executive Order 14413 establishes the QC-ADDS Effort
        source: White House
        url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - date: 2026-06-23
        kind: implementation
        title: DOE identifies Quantum Genesis as the first step toward QC-ADDS
        source: Department of Energy
        url: https://www.energy.gov/science/articles/energy-department-announces-initiative-create-and-deploy-worlds-first

  - id: quantumeagle
    name: QuantumEAGLe
    kind: federal initiative
    status: active
    phase: industry engagement and research
    priority: high
    announcement_date: 2026-06-30
    aliases:
      - QuantumEAGLe
      - Quantum Ecosystem Advancement, Growth & Leadership
    lead_agencies:
      - NSA Laboratory for Physical Sciences
      - DEVCOM Army Research Office
    partners:
      - U.S. quantum industry
      - Army Contracting Command
    domains:
      - Quantum ecosystem
      - Domestic supply chain
      - Commercial roadmaps
      - Quantum algorithms
      - Error correction
      - Foundational research
    objective: >-
      Accelerate the U.S. quantum-computing ecosystem through industry engagement, commercial
      roadmaps, supply-chain advancement, algorithm and error-correction development, and
      foundational research supporting fault-tolerant quantum computing.
    official_url: https://www.nsa.gov/Press-Room/Press-Releases-Statements/Press-Release-View/Article/4529557/nsa-devcom-army-research-office-launch-quantumeagle-initiative/
    related_missions:
      - QC-ADDS
    milestones: []
    updates:
      - date: 2026-06-30
        kind: launch
        title: NSA and DEVCOM Army Research Office launch QuantumEAGLe
        source: NSA
        url: https://www.nsa.gov/Press-Room/Press-Releases-Statements/Press-Release-View/Article/4529557/nsa-devcom-army-research-office-launch-quantumeagle-initiative/
