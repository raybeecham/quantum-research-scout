watch_sources:
  - name: "Cisco Quantum-Safe Updates"
    entities: [Cisco]
    rss_url: "https://blogs.cisco.com/feed"
    sitemap_urls: ["https://blogs.cisco.com/sitemap_index.xml"]
    url: "https://blogs.cisco.com/tag/post-quantum-cryptography"
    include_patterns: [post-quantum, post_quantum, quantum, cryptograph]
    match_patterns: [post-quantum, post quantum, quantum-safe, quantum safe, cryptograph]
    max_items: 25
  - name: "Wiz Post-Quantum Security"
    entities: [Wiz]
    sitemap_urls: ["https://www.wiz.io/sitemap.xml"]
    url: "https://www.wiz.io/blog"
    include_patterns: [/blog/, quantum, cryptograph]
    exclude_patterns: [/events/, /webinars/]
    match_patterns: [post-quantum, post quantum, quantum readiness, cryptograph]
    max_items: 25
  - name: "QCi Press Releases"
    entities: ["Quantum Computing Inc. (QCi)"]
    sitemap_urls: ["https://quantumcomputinginc.com/sitemap.xml"]
    url: "https://quantumcomputinginc.com/news/press-releases"
    include_patterns: [/news/press-releases/]
    max_items: 30
  - name: "Fortanix Quantum Security"
    entities: [Fortanix]
    rss_url: "https://www.fortanix.com/blog/rss.xml"
    sitemap_urls: ["https://www.fortanix.com/sitemap.xml"]
    url: "https://www.fortanix.com/blog"
    include_patterns: [/blog/, quantum, cryptograph]
    match_patterns: [post-quantum, post quantum, quantum-safe, quantum safe, crypto-agil, cryptograph]
    max_items: 25
  - name: "MITRE Quantum and PQC"
    entities: [MITRE]
    enabled: false  # MITRE blocks both sitemap and newsroom collection with HTTP 403.
    sitemap_urls: ["https://www.mitre.org/sitemap.xml"]
    url: "https://www.mitre.org/news-insights"
    include_patterns: [/news-insights/, quantum, cryptograph]
    match_patterns: [post-quantum, post quantum, quantum computing, quantum technology, cryptograph]
    max_items: 25
