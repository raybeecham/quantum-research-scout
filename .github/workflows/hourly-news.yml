name: Frontier Signal Hourly News
# Cron dispatches get their own run name so the Pages alert can tell them apart.
run-name: ${{ inputs.trigger == 'cron' && 'Frontier Signal Hourly News (cron)' || 'Frontier Signal Hourly News' }}

on:
  schedule:
    # Off the top of the hour. GitHub schedules are best effort, not an SLA,
    # so two slots back each other up; the due job keeps one collection per hour.
    # The frontier-hourly-trigger Worker (cron-trigger/) dispatches the same slots.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "manual collects now; cron applies the same 45-minute gate as scheduled slots"
        type: choice
        options: [manual, cron]
        default: manual

# Share the daily writer's lock so source history and archives cannot race.
concurrency:
  group: daily-report-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Chicago

jobs:
  due:
    name: Check whether hourly news is due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.slot.outputs.should_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Skip a slot when the other one already collected this hour
        id: slot
        env:
          HOURLY_TRIGGER: ${{ inputs.trigger }}
        run: python scripts/hourly_news_due.py --github-output "$GITHUB_OUTPUT"

  news:
    name: Collect and publish hourly news
    needs: due
    if: needs.due.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install agent
        run: python -m pip install .
      - name: Collect public news with a 48-hour overlap
        # No SAM.gov, USPTO, AI or notification credentials are needed here.
        run: >-
          pqc-quantum-research-agent --hourly-news --config sources.yaml
          --reports-dir reports
      - name: Preserve feed health even if publication fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: feed-health-observation
          path: reports/source-health.json
          retention-days: 2
          if-no-files-found: ignore
      - name: Refresh publisher story previews
        timeout-minutes: 2
        continue-on-error: true
        run: python scripts/enrich_story_images.py --reports reports --max-items 12 --budget-seconds 60
      - name: Sanitize public reports
        run: |
          python scripts/sanitize_report_secrets.py reports --write
          python scripts/sanitize_report_secrets.py reports
      - name: Validate dashboard and preserve permanent story URLs
        run: |
          python scripts/build_dashboard.py --output "$RUNNER_TEMP/hourly-dashboard-check"
          python scripts/retain_story_urls.py --site "$RUNNER_TEMP/hourly-dashboard-check"
      - name: Commit hourly news refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/hourly
          git add reports/source-observations.json reports/source-health.json reports/source-health.md
          git add reports/story-evidence.json reports/story-urls.json
          if [ -f reports/story-images.json ]; then git add reports/story-images.json; fi
          if git diff --cached --quiet; then
            echo "No news changes to publish"
          else
            git commit -m "Hourly emerging technology news refresh"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
