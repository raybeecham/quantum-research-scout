settings:
  max_items_per_source: 40
  min_score: 3
  min_topic_confidence: 4
  report_top_n: 15
  report_limit_per_source: 5
  fuzzy_title_threshold: 0.92
  request_timeout_seconds: 20
  user_agent: "pqc-quantum-research-agent/0.1 (project: project: https://github.com/raybeecham/quantum-research-scout; contact: configure-in-sources-yaml)"

source_health:
  stale_after_days: 14

historical_backfill:
  lookback_days: 730
  max_items_per_source: 25
  include_undated: true

patents:
  enabled: true
  provider: "uspto_odp"
  endpoint: "https://api.uspto.gov/api/v1/patent/applications/search"
  api_key_env: "USPTO_ODP_API_KEY"
  max_items_per_query: 25
  queries:
    - name: "Post-Quantum Cryptography Patents"
      search_query: 'post-quantum OR quantum-safe OR quantum-resistant OR ML-KEM OR ML-DSA'
    - name: "Quantum Computing Patents"
      search_query: '"quantum computing" OR "quantum processor" OR qubit'
    - name: "Quantum Networking and Sensing Patents"
      search_query: '"quantum network" OR "quantum communication" OR "quantum sensing"'

arxiv:
  enabled: false
  max_results: 25
  sort_by: submittedDate
  sort_order: descending
  request_pause_seconds: 4.0
  queries:
    - name: "arXiv PQC and Quantum-Safe Cryptography"
      search_query: 'cat:cs.CR AND (all:"post-quantum" OR all:"post quantum" OR all:"quantum-safe" OR all:"quantum resistant" OR all:"ML-KEM" OR all:"ML-DSA" OR all:"SLH-DSA" OR all:"Kyber" OR all:"Dilithium" OR all:"SPHINCS" OR all:"Falcon" OR all:"lattice cryptography")'
    - name: "arXiv Quantum Computing"
      search_query: 'cat:quant-ph AND (all:"fault tolerant" OR all:"fault-tolerant" OR all:"logical qubit" OR all:"quantum error correction" OR all:"QEC" OR all:"trapped ion" OR all:"superconducting" OR all:"neutral atom" OR all:"photonic")'
    - name: "arXiv Quantum Networking and Sensing"
      search_query: 'cat:quant-ph AND (all:"quantum network" OR all:"quantum networking" OR all:"quantum internet" OR all:"entanglement" OR all:"quantum sensing" OR all:"quantum sensor" OR all:"QKD")'

arxiv_rss:
  - name: "arXiv RSS cs.CR"
    url: "https://rss.arxiv.org/rss/cs.CR"
  - name: "arXiv RSS quant-ph"
    url: "https://rss.arxiv.org/rss/quant-ph"

iacr_eprint:
  enabled: true
  name: "IACR ePrint"
  feed_url: "https://eprint.iacr.org/rss/rss.xml?order=recent"

rss_feeds:
  - name: "The Quantum Insider"
    url: "https://thequantuminsider.com/feed/"
    supplemental_sitemap_urls: ["https://thequantuminsider.com/wp-sitemap.xml"]
    sitemap_include_patterns: [post-sitemap]
    include_patterns: ["/20"]
    max_sitemaps: 1
    sitemap_max_items: 40
  - name: "Quantum Zeitgeist"
    url: "https://quantumzeitgeist.com/feed/"
  - name: "CISA Cybersecurity Advisories"
    url: "https://www.cisa.gov/cybersecurity-advisories/all.xml"
    entities: [CISA]
  - name: "PQCA Readiness Tracking"
    url: "https://lists.pqca.org/g/wg-readiness-tracking/rss"
    entities: [PQCA]
  - name: "PQCA Blog and News"
    url: "https://pqca.org/feed/"
    max_items: 25
    entities: [PQCA]
  - name: "NCSC UK Guidance"
    url: "https://www.ncsc.gov.uk/api/1/services/v1/guidance-rss-feed.xml"
    max_items: 25
    entities: [UK NCSC]
  - name: "NCSC UK News"
    url: "https://www.ncsc.gov.uk/api/1/services/v1/news-rss-feed.xml"
    max_items: 25
    entities: [UK NCSC]
  - name: "NCSC UK Reports"
    url: "https://www.ncsc.gov.uk/api/1/services/v1/report-rss-feed.xml"
    max_items: 25
    entities: [UK NCSC]
  - name: "Cloudflare Blog"
    url: "https://blog.cloudflare.com/rss/"
    entities: [Cloudflare]
  - name: "Google Security Blog"
    url: "https://security.googleblog.com/feeds/posts/default"
    entities: [Google Quantum AI]
  - name: "AWS Quantum Technologies Blog"
    url: "https://aws.amazon.com/blogs/quantum-computing/feed/"
    entities: [AWS]
  - name: "InfoQ Quantum Computing"
    url: "https://feed.infoq.com/quantumcomputing/news/"
    max_items: 25
  - name: "DigiCert Blog"
    url: "https://www.digicert.com/blog/feed/"
    entities: [DigiCert]
  - name: "Keyfactor Blog"
    url: "https://www.keyfactor.com/blog/feed/"
    enabled: false  # Official endpoint no longer returns a parseable feed.
    entities: [Keyfactor]

urls:
  - name: "QuantumNews.ai"
    url: "https://quantumnews.ai/"
    same_domain_only: false
    max_items: 60
  - name: "NIST CSRC News"
    url: "https://csrc.nist.gov/news"
    entities: [NIST]
  - name: "NIST Post-Quantum Cryptography Project"
    url: "https://csrc.nist.gov/projects/post-quantum-cryptography"
    entities: [NIST]
  - name: "NSA Cybersecurity Advisories"
    url: "https://www.nsa.gov/Cybersecurity/Cybersecurity-Advisories-Guidance/"
    enabled: false  # NSA blocks this automated HTML collector with HTTP 403.
    entities: [NSA]
  - name: "IETF PQUIP"
    url: "https://datatracker.ietf.org/group/pquip/about/"
    entities: [IETF]
  - name: "Google Quantum AI"
    url: "https://quantumai.google/"
    entities: [Google Quantum AI]
  - name: "Open Quantum Safe"
    url: "https://openquantumsafe.org/news/"
    entities: [Open Quantum Safe]
  - name: "Cloudflare Post-Quantum Blog"
    url: "https://blog.cloudflare.com/tag/post-quantum/"
    min_title_chars: 18
    entities: [Cloudflare]
  - name: "PQShield"
    url: "https://pqshield.com/"
    entities: [PQShield]
  - name: "IBM Quantum Blog"
    url: "https://www.ibm.com/quantum/blog"
    entities: [IBM]
  - name: "Microsoft Quantum Blog"
    url: "https://quantum.microsoft.com/en-us/insights/blogs"
