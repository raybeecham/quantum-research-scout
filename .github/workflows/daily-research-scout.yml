name: Daily PQC Quantum Research Scout

on:
  schedule:
    # UTC schedule: 00:00 daily.
    # Intended local schedule: 7:00 PM US Central Time during daylight saving time (CDT, UTC-5).
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scout:
    name: Collect and report
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore research database cache
        uses: actions/cache@v5
        with:
          path: data/research_items.sqlite
          key: pqc-quantum-research-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pqc-quantum-research-db-${{ runner.os }}-

      - name: Install agent
        run: python -m pip install .

      - name: Run research scout in default daily RSS mode
        run: >
          pqc-quantum-research-agent
          --config sources.yaml
          --db data/research_items.sqlite
          --reports-dir reports

      - name: Commit Markdown digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet -- reports/; then
            echo "No report changes to commit."
            exit 0
          fi
          git commit -m "Daily PQC digest $(date -u +%F)"
          git push origin HEAD:main

      - name: Upload Markdown digest
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-research-digest
          path: reports/*.md
          if-no-files-found: error

      - name: Upload SQLite database
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-research-db
          path: data/research_items.sqlite
          if-no-files-found: error
