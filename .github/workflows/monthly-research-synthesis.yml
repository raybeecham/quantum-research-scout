name: Monthly PQC Quantum Research Synthesis

on:
  schedule:
    # Generate the prior month's synthesis on the first day of each month.
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "Optional target month (YYYY-MM); defaults to the prior month"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Chicago

jobs:
  monthly-synthesis:
    name: Generate monthly synthesis
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install agent
        run: python -m pip install .

      - name: Generate monthly synthesis
        env:
          REPORTS_DIR: ${{ github.workspace }}/reports
          TARGET_MONTH: ${{ inputs.month }}
        run: |
          mkdir -p "$REPORTS_DIR/monthly"
          MONTH_ARGS=()
          if [ -n "$TARGET_MONTH" ]; then
            MONTH_ARGS=(--month "$TARGET_MONTH")
          fi
          pqc-quantum-research-agent \
            --reports-dir "$REPORTS_DIR" \
            --monthly \
            "${MONTH_ARGS[@]}" \
            --update-report-index

      - name: Commit generated monthly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/monthly reports/README.md
          if git diff --cached --quiet; then
            echo "No monthly report changes to commit"
          else
            git commit -m "Monthly PQC synthesis $(date +%F)"
            git push
          fi

      - name: Upload monthly synthesis
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-monthly-synthesis
          path: reports/monthly/*/*-monthly.md
          if-no-files-found: error
