timezone: America/Chicago

milestones:
  - id: nist-fips-203-final
    title: FIPS 203 (ML-KEM) finalized
    authority: NIST
    kind: standard
    target_date: 2024-08-13
    date_precision: exact
    status: completed
    summary: NIST finalized its primary post-quantum key-encapsulation standard.
    technologies: [ML-KEM, FIPS 203]
    source_url: https://csrc.nist.gov/pubs/fips/203/final
  - id: nist-fips-204-final
    title: FIPS 204 (ML-DSA) finalized
    authority: NIST
    kind: standard
    target_date: 2024-08-13
    date_precision: exact
    status: completed
    summary: NIST finalized its module-lattice digital-signature standard.
    technologies: [ML-DSA, FIPS 204]
    source_url: https://csrc.nist.gov/pubs/fips/204/final
  - id: nist-fips-205-final
    title: FIPS 205 (SLH-DSA) finalized
    authority: NIST
    kind: standard
    target_date: 2024-08-13
    date_precision: exact
    status: completed
    summary: NIST finalized its stateless hash-based digital-signature standard.
    technologies: [SLH-DSA, FIPS 205]
    source_url: https://csrc.nist.gov/pubs/fips/205/final
  - id: nist-hqc-selected
    title: HQC selected for standardization
    authority: NIST
    kind: standard
    target_date: 2025-03-11
    date_precision: exact
    status: completed
    summary: NIST selected HQC as a backup key-encapsulation mechanism based on different mathematics from ML-KEM.
    technologies: [HQC]
    source_url: https://www.nist.gov/news-events/news/2025/03/nist-selects-hqc-fifth-algorithm-post-quantum-encryption
  - id: cnssp-15-release
    title: CNSS Policy 15 with CNSA 2.0 released
    authority: CNSS / NSA
    kind: policy
    target_date: 2025-03-04
    date_precision: exact
    status: completed
    summary: Updated national-security-system policy incorporated CNSA 2.0 requirements.
    technologies: [CNSA 2.0]
    source_url: https://www.nsa.gov/Cybersecurity/Post-Quantum-Cybersecurity-Resources/
  - id: federal-pqc-execution-guidance
    title: OMB M-26-15 federal PQC execution guidance issued
    authority: OMB
    kind: policy
    target_date: 2026-06-24
    date_precision: exact
    status: completed
    summary: OMB established phased federal migration from discovery and planning through full migration.
    technologies: [ML-KEM, ML-DSA, Crypto-agility]
    source_url: https://www.whitehouse.gov/wp-content/uploads/2026/06/M-26-15-Execution-of-the-Migration-to-Post-Quantum-Cryptography.pdf
