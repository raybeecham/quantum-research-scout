timezone: America/Chicago

scope_note: >-
  Named, cross-agency or cross-sector federal science and technology missions, initiatives, and
  national efforts relevant to quantum technology, AI, cybersecurity, energy, discovery science,
  and national security. Routine agency mission statements and unrelated operational missions are
  excluded.

discovery:
  recent_launch_days: 365
  candidate_retention_days: 730

missions:
  - id: genesis-mission
    name: Genesis Mission
    kind: national mission
    status: active
    phase: execution
    priority: critical
    announcement_date: 2025-11-24
    aliases:
      - Genesis Mission
      - American Science and Security Platform
    lead_agencies:
      - Department of Energy
      - White House Office of Science and Technology Policy
    partners:
      - 17 DOE National Laboratories
      - National Science and Technology Council
      - Industry
      - Academia
      - Philanthropic organizations
      - International research partners
    domains:
      - Artificial intelligence
      - Quantum information science
      - High-performance computing
      - Energy
      - Discovery science
      - National security
    objective: >-
      Build an integrated American Science and Security Platform connecting federal scientific
      datasets, supercomputers, AI systems, experimental facilities, and emerging quantum systems
      to double the productivity and impact of American research and engineering within a decade.
    official_url: https://www.energy.gov/undersecretaryforscience/genesis-mission/genesis-mission
    related_missions:
      - Quantum Genesis
      - QC-ADDS
    milestones:
      - id: genesis-national-challenges
        title: Identify at least 20 national science and technology challenges
        target_date: 2026-01-23
        date_precision: exact
        status: completed
        summary: DOE subsequently announced a portfolio of 26 challenges.
        source_url: https://www.energy.gov/undersecretaryforscience/articles/energy-department-announces-26-genesis-mission-science-and
      - id: genesis-robotic-lab-review
        title: Review federal robotic and AI-directed laboratory capabilities
        target_date: 2026-07-22
        date_precision: exact
        status: monitoring
        summary: Executive Order 14363 set a 240-day review of robotic laboratories, production facilities, and enabling standards.
        source_url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - id: genesis-initial-operating-capability
        title: Seek initial platform operating capability for at least one national challenge
        target_date: 2026-08-21
        date_precision: exact
        status: monitoring
        summary: Executive Order 14363 set a 270-day objective, subject to law and available appropriations.
        source_url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - id: genesis-first-annual-report
        title: Submit the first annual Genesis Mission progress report
        target_date: 2026-11-24
        date_precision: exact
        status: monitoring
        summary: The report covers platform operations, integration, users, research outcomes, partnerships, and support needs.
        source_url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - id: genesis-decade-goal
        title: Double the productivity and impact of American research and engineering
        target_date: 2035-12-31
        date_precision: year
        status: estimated
        summary: The public goal is stated as within a decade rather than as a fixed statutory deadline.
        source_url: https://genesis.energy.gov/
    updates:
      - date: 2025-11-24
        kind: launch
        title: Executive Order 14363 launches the Genesis Mission
        source: White House
        url: https://www.whitehouse.gov/presidential-actions/2025/11/launching-the-genesis-mission/
      - date: 2026-02-12
        kind: portfolio
        title: DOE announces 26 national science and technology challenges
        source: Department of Energy
        url: https://www.energy.gov/undersecretaryforscience/articles/energy-department-announces-26-genesis-mission-science-and
      - date: 2026-03-17
        kind: funding
        title: DOE announces $293 million for Genesis Mission challenges
        source: Department of Energy
        url: https://www.energy.gov/articles/energy-department-announces-293-million-funding-support-genesis-mission-national-science
      - date: 2026-06-04
        kind: international partnership
        title: United States and Japan announce a $1 billion Genesis Mission partnership
        source: Department of Energy
        url: https://www.energy.gov/articles/united-states-and-japan-announce-historic-1-billion-partnership-under-president-trumps
      - date: 2026-07-22
        kind: execution
        title: DOE reports more than $800 million in partner commitments
        source: Department of Energy
        url: https://www.energy.gov/undersecretaryforscience/articles/us-department-energy-announces-more-800-million-partner

  - id: quantum-genesis
    name: Quantum Genesis
    kind: federal initiative
    status: active
    phase: competition and capability development
