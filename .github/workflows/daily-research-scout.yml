name: Daily PQC Quantum Research Scout

on:
  schedule:
    # UTC schedule: 00:00 daily.
    # 7 PM CDT / 6 PM CST. Off-peak catch-up checks skip completed periods.
    - cron: "0 0 * * *"
    - cron: "17 0,2,4 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Optional America/Chicago report date to regenerate (YYYY-MM-DD)"
        required: false
        type: string
      force:
        description: "Regenerate even if this period already has a validated publication receipt"
        type: boolean
        default: false

# Serialize the gate AND collection so a late primary cannot race its catch-up.
concurrency:
  group: daily-report-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Chicago

jobs:
  publication-gate:
    name: Check whether the daily report is due
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.period.outputs.should_run }}
      report_date: ${{ steps.period.outputs.report_date }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Resolve due period and check publication receipt
        id: period
        env:
          REPORT_DATE: ${{ inputs.report_date || '' }}
          FORCE_REPORT: ${{ inputs.force || false }}
        run: python scripts/report_schedule.py plan --kind daily --github-output "$GITHUB_OUTPUT"

  scout:
    name: Collect and report
    needs: publication-gate
    if: needs.publication-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore research database cache
        uses: actions/cache@v5
        with:
          path: data/research_items.sqlite
          key: pqc-quantum-research-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pqc-quantum-research-db-${{ runner.os }}-

      - name: Install agent
        run: python -m pip install .

      - name: Run research scout in default Central day coverage mode
        env:
          REPORTS_DIR: ${{ github.workspace }}/reports
          REPORT_DATE: ${{ needs.publication-gate.outputs.report_date }}
          USPTO_ODP_API_KEY: ${{ secrets.USPTO_ODP_API_KEY }}
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: |
          mkdir -p "$REPORTS_DIR"
          RETENTION_DAYS=30
          # On the UTC first of a month, retain one extra day until the monthly synthesis has consumed it.
          if [ "$(date -u +%d)" = "01" ]; then
            RETENTION_DAYS=31
          fi
          pqc-quantum-research-agent \
            --config sources.yaml \
            --db data/research_items.sqlite \
            --reports-dir "$REPORTS_DIR" \
            --date "$REPORT_DATE" \
            --prune-daily-reports \
            --retention-days "$RETENTION_DAYS" \
            --update-intelligence-tracking \
            --update-report-index

      - name: Refresh cached scholarly citation metadata
        timeout-minutes: 5
        continue-on-error: true
        run: python scripts/enrich_citations.py --reports reports --max-items 12

      - name: Sanitize generated reports
        run: |
          python scripts/sanitize_report_secrets.py reports --write
          python scripts/sanitize_report_secrets.py reports

      - name: Enforce critical collection coverage before publication
        run: python scripts/check_collection_health.py reports/source-health.json --fail-on-degraded

      - name: Validate dashboard build before publication
        run: python scripts/build_dashboard.py --output "$RUNNER_TEMP/daily-dashboard-check"

      - name: Record validated daily completion
        env:
          REPORT_DATE: ${{ needs.publication-gate.outputs.report_date }}
        run: python scripts/report_schedule.py record --kind daily

      - name: Commit generated reports and publication receipt
        env:
          REPORT_DATE: ${{ needs.publication-gate.outputs.report_date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Daily PQC digest $REPORT_DATE"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish intelligence alerts to workflow summary
        run: |
          if [ -f reports/alerts.md ]; then
            cat reports/alerts.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare optional GitHub Issue alert
        id: alert-issue
        run: python scripts/prepare_alert_issue.py --github-output "$GITHUB_OUTPUT"

      - name: Deliver new alerts as a GitHub Issue
        if: vars.ALERT_DELIVERY_GITHUB_ISSUES == 'true' && steps.alert-issue.outputs.should_create == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_ISSUE_TITLE: ${{ steps.alert-issue.outputs.title }}
        run: gh issue create --title "$ALERT_ISSUE_TITLE" --body-file alert-issue.md

      - name: Prepare notification payloads
        id: notifications
        run: |
          python scripts/prepare_notifications.py \
            --github-output "$GITHUB_OUTPUT" \
            --email-to "${{ vars.ALERT_EMAIL_TO }}" \
            --email-from "${{ vars.ALERT_EMAIL_FROM }}"

      - name: Deliver immediate alerts to Slack
        if: vars.ALERT_DELIVERY_SLACK == 'true' && steps.notifications.outputs.send_immediate == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: >-
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json"
          --data-binary @.notifications/slack-immediate.json "$WEBHOOK_URL"

      - name: Deliver daily summary to Slack
        if: vars.ALERT_DELIVERY_SLACK == 'true' && steps.notifications.outputs.send_digest == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.SLACK_ALERT_WEBHOOK_URL }}
        run: >-
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json"
          --data-binary @.notifications/slack-digest.json "$WEBHOOK_URL"

      - name: Deliver immediate alerts to Teams
        if: vars.ALERT_DELIVERY_TEAMS == 'true' && steps.notifications.outputs.send_immediate == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_ALERT_WEBHOOK_URL }}
        run: >-
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json"
          --data-binary @.notifications/teams-immediate.json "$WEBHOOK_URL"

      - name: Deliver daily summary to Teams
        if: vars.ALERT_DELIVERY_TEAMS == 'true' && steps.notifications.outputs.send_digest == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_ALERT_WEBHOOK_URL }}
        run: >-
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json"
          --data-binary @.notifications/teams-digest.json "$WEBHOOK_URL"

      - name: Deliver immediate alerts to a generic webhook
        if: vars.ALERT_DELIVERY_GENERIC_WEBHOOK == 'true' && steps.notifications.outputs.send_immediate == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.GENERIC_ALERT_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.GENERIC_ALERT_WEBHOOK_TOKEN }}
        run: |
          AUTH_HEADER=()
          if [ -n "${WEBHOOK_TOKEN:-}" ]; then AUTH_HEADER=(-H "Authorization: Bearer $WEBHOOK_TOKEN"); fi
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" "${AUTH_HEADER[@]}" --data-binary @.notifications/generic-immediate.json "$WEBHOOK_URL"

      - name: Deliver daily summary to a generic webhook
        if: vars.ALERT_DELIVERY_GENERIC_WEBHOOK == 'true' && steps.notifications.outputs.send_digest == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.GENERIC_ALERT_WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.GENERIC_ALERT_WEBHOOK_TOKEN }}
        run: |
          AUTH_HEADER=()
          if [ -n "${WEBHOOK_TOKEN:-}" ]; then AUTH_HEADER=(-H "Authorization: Bearer $WEBHOOK_TOKEN"); fi
          curl --fail-with-body --silent --show-error -H "Content-Type: application/json" "${AUTH_HEADER[@]}" --data-binary @.notifications/generic-digest.json "$WEBHOOK_URL"

      - name: Deliver immediate alert email with Resend
        if: vars.ALERT_DELIVERY_EMAIL == 'true' && steps.notifications.outputs.send_immediate == 'true' && steps.notifications.outputs.email_ready == 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: qrs-${GITHUB_RUN_ID}-immediate" \
            --data-binary @.notifications/email-immediate.json

      - name: Deliver daily summary email with Resend
        if: vars.ALERT_DELIVERY_EMAIL == 'true' && steps.notifications.outputs.send_digest == 'true' && steps.notifications.outputs.email_ready == 'true'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl --fail-with-body --silent --show-error https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: qrs-${GITHUB_RUN_ID}-digest" \
            --data-binary @.notifications/email-digest.json

      - name: Upload Markdown digest
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-research-digest
          path: |
            reports/*-digest.md
            reports/*/*-digest.md
          if-no-files-found: error

      - name: Upload SQLite database
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-research-db
          path: data/research_items.sqlite
          if-no-files-found: error
