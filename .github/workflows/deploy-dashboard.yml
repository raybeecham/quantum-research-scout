name: Deploy Intelligence Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "reports/**"
      - "scripts/build_dashboard.py"
      - "scripts/package_dashboard.py"
      - "pqc_quantum_research_agent/publication.py"
      - "scripts/enrich_story_images.py"
      - "pqc_quantum_research_agent/story_images.py"
      - "pqc_quantum_research_agent/briefing.py"
      - "pqc_quantum_research_agent/hourly_news.py"
      - "pqc_quantum_research_agent/technology_briefing.py"
      - "pqc_quantum_research_agent/news_intelligence.py"
      - "pqc_quantum_research_agent/dashboard_data.py"
      - "pqc_quantum_research_agent/story_analysis.py"
      - "pqc_quantum_research_agent/story_archive.py"
      - "pqc_quantum_research_agent/story_follow.py"
      - "pqc_quantum_research_agent/primary_evidence.py"
      - "pqc_quantum_research_agent/evidence_review.py"
      - "pqc_quantum_research_agent/citations.py"
      - "readiness.yaml"
      - "standards.yaml"
      - "missions.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_run:
    workflows:
      - "Frontier Signal Daily Briefing"
      - "Frontier Signal Hourly News"
      - "Frontier Signal Weekly Synthesis"
      - "Frontier Signal Monthly Synthesis"
      - "Weekly Historical Intelligence Backfill"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  publication-check:
    name: Check for a publishable report run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/github-script@v8
        id: check
        with:
          script: |
            const run = context.payload.workflow_run;
            // Successful catch-up no-ops also rebuild Pages: they can recover a
            // failed deployment without collecting evidence or sending alerts.
            let deploy = !run || run.conclusion === 'success';
            if (run && !deploy && ['Frontier Signal Daily Briefing', 'Frontier Signal Weekly Synthesis', 'Frontier Signal Hourly News'].includes(run.name)) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              // A later notification/artifact failure must not strand a report
              // that passed validation and was successfully committed/pushed.
              const published = new Set(['Commit generated reports and publication receipt', 'Commit generated weekly reports', 'Commit hourly news refresh']);
              deploy = jobs.some(job => (job.steps || []).some(step => published.has(step.name) && step.conclusion === 'success'));
            }
            core.setOutput('deploy', String(deploy));

  build-and-deploy:
    needs: publication-check
    if: needs.publication-check.outputs.deploy == 'true'
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dashboard build dependencies
        run: python -m pip install ".[browser,dev]"

      - name: Build static dashboard
        run: python scripts/build_dashboard.py --output site

      - name: Install browser runtime
        run: python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned accessibility audit
        working-directory: scripts/browser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Gate this exact artifact before deployment
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python scripts/verify_frontier_round2_browser.py --channel chromium
          python scripts/verify_lazy_data_browser.py --channel chromium
          python scripts/verify_round4_browser.py --channel chromium
          python scripts/verify_hourly_news_browser.py --channel chromium
          python scripts/verify_tab_cleanup_browser.py --channel chromium
          python scripts/verify_conferences_browser.py --channel chromium
          python scripts/verify_accessibility_browser.py --channel chromium
          xvfb-run -a python scripts/verify_publication_gate.py --channel chromium --headed

      - name: Preserve release gate evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence
          path: site/verification/
          if-no-files-found: ignore

      - name: Require retained story addresses before publication
        # No repository write permission is granted to deployment.
        run: python scripts/retain_story_urls.py --site site --check

      - name: Stage only verified public files
        run: python scripts/package_dashboard.py --site site --output "$RUNNER_TEMP/pages-public"

      - name: Upload Pages artifact
        # Test evidence stays in the separate release-gate-evidence artifact.
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  scheduled-deploy-alert:
    needs: [publication-check, build-and-deploy]
    # Scheduled and Worker-cron collections run unattended, so a blocked
    # deployment would otherwise leave the live site stale without anyone
    # noticing. Push and manual deployments are watched by whoever started them.
    if: >-
      always() && github.event_name == 'workflow_run' &&
      (github.event.workflow_run.event == 'schedule' ||
      github.event.workflow_run.display_title == 'Frontier Signal Hourly News (cron)')
    name: Report scheduled deployment outcome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v8
        env:
          CHECK_RESULT: ${{ needs.publication-check.result }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
        with:
          script: |
            const marker = '<!-- frontier-deploy:scheduled -->';
            const { CHECK_RESULT: check, DEPLOY_RESULT: deploy } = process.env;
            // A skipped deployment means the collection itself did not publish;
            // feed-health incidents cover that case.
            const failed = check === 'failure' || ['failure', 'cancelled'].includes(deploy);
            if (!failed && deploy !== 'success') return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            const open = issues.find(issue => !issue.pull_request && (issue.body || '').includes(marker));
            const source = context.payload.workflow_run;
            const deployRun = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const detail = `Collection: ${source.name} ${source.html_url}\nDeployment: ${deployRun}`;
            if (failed && open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number, body: `Failed again.\n\n${detail}`
              });
            } else if (failed) {
              await github.rest.issues.create({
                ...context.repo,
                title: 'Scheduled site deployment failed',
                body: `${marker}\nA scheduled collection finished, but the Pages deployment after it did not, so the live site still shows older data. Open the deployment run to see which step failed. This issue closes after the next successful scheduled deployment.\n\n${detail}`
              });
            } else if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number, body: `Recovered.\n\n${detail}`
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number, state: 'closed', state_reason: 'completed'
              });
            }
