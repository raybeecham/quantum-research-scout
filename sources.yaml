    sitemap_urls: ["https://newsroom.accenture.com/sitemap.xml"]
    url: "https://newsroom.accenture.com/"
    include_patterns: [quantum, post-quantum, quantum-safe, crypto-agil]
    match_patterns: [quantum, post-quantum, quantum-safe, crypto-agil]
    max_items: 25
  - name: "Accenture Federal Services Quantum Readiness"
    entities: ["Accenture / Accenture Federal Services"]
    url: "https://www.accenture.com/us-en/insights/us-federal-government/future-quantum-speed"
    include_source_page: true
    include_patterns: [quantum, post-quantum, quantum-safe, cryptograph]
    match_patterns: [quantum, post-quantum, quantum-safe, cryptograph]
    max_items: 10
  - name: "Booz Allen Quantum and PQC"
    entities: [Booz Allen Hamilton]
    sitemap_urls: ["https://www.boozallen.com/sitemap.xml"]
    url: "https://www.boozallen.com/expertise/analytics/quantum-computing.html"
    include_source_page: true
    include_patterns: [quantum, post-quantum, cryptograph]
    match_patterns: [quantum, post-quantum, cryptograph]
    max_items: 25
  - name: "Lockheed Martin Quantum Technology"
    entities: [Lockheed Martin]
    sitemap_urls: ["https://www.lockheedmartin.com/sitemap.xml"]
