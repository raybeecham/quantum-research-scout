    summary: Executive Order 14412 directs public guidance on minimum cryptographic bill-of-materials elements within 270 days.
    technologies: [CBOM, Cryptographic inventory]
    source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
