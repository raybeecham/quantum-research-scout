  - id: darpa-qbi
    name: DARPA Quantum Benchmarking Initiative
    kind: quantum verification initiative
    status: active
    phase: staged technical evaluation
    priority: critical
    announcement_date: 2024-07-16
    aliases:
      - DARPA Quantum Benchmarking Initiative
      - Quantum Benchmarking Initiative
      - QBI
      - QBIT
    lead_agencies:
      - Defense Advanced Research Projects Agency
    partners:
      - Department of Energy Office of Science
      - Air Force Research Laboratory
      - State of Illinois
      - State of Maryland
      - State of New Mexico
      - Quantum computing companies
      - Independent verification and validation teams
    domains:
      - Utility-scale quantum computing
      - Fault-tolerant quantum computing
      - Quantum benchmarking
      - Verification and validation
      - Quantum applications
    objective: >-
      Rigorously determine whether any quantum-computing architecture can achieve utility-scale
      operation, where computational value exceeds cost, and whether an industrially useful
      quantum computer can be built by 2033.
    official_url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
    related_missions:
      - QC-ADDS
      - Quantum Genesis
    milestones:
      - id: qbi-qbit-abstracts
        title: Receive abstracts for the expanded QBIT Stage A solicitation
        target_date: 2026-07-31
        date_precision: exact
        status: planned
        summary: DARPA invited additional distinct technical approaches not yet evaluated under QBI.
        source_url: https://www.darpa.mil/news/2026/qbi-stage-a-qbit
      - id: qbi-qbit-stage-a
        title: Close the QBIT Stage A full-proposal window
        target_date: 2026-09-30
        date_precision: exact
        status: planned
        summary: Selected entrants will describe a full utility-scale system concept and evidence supporting its feasibility.
        source_url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
      - id: qbi-ivv
        title: Close the QBI independent verification and validation topic
        target_date: 2026-10-15
        date_precision: exact
        status: planned
        summary: The topic supports independent technical verification and validation of participating approaches.
        source_url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
      - id: qbi-2026
        title: Close the umbrella QBI 2026 announcement
        target_date: 2026-11-14
        date_precision: exact
        status: planned
        summary: DARPA lists this as the deadline for the broader 2026 QBI announcement.
        source_url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
      - id: qbi-2033
        title: Determine whether an industrially useful quantum computer is achievable
        target_date: 2033-12-31
        date_precision: year
        status: estimated
        summary: DARPA expresses the program goal as determining feasibility by 2033 rather than as a fixed day-level deadline.
        source_url: https://www.darpa.mil/research/programs/quantum-benchmarking-initiative
    updates:
      - date: 2024-07-16
        kind: launch
        title: DARPA announces the Quantum Benchmarking Initiative
        source: DARPA
        url: https://www.darpa.mil/news/2024/quantum-computing-prototype
      - date: 2026-03-10
        kind: expansion
