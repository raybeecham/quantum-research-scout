  - id: federal-pqc-transition
    name: Federal Post-Quantum Cryptography Transition
    kind: national cybersecurity transition
    status: active
    phase: agency planning and implementation
    priority: critical
    announcement_date: 2026-06-22
    aliases:
      - Federal Post-Quantum Cryptography Transition
      - Federal PQC Transition
      - national PQC migration policy
      - Executive Order 14412
    lead_agencies:
      - Office of Management and Budget
      - Office of the National Cyber Director
    partners:
      - Department of Commerce
      - National Institute of Standards and Technology
      - Cybersecurity and Infrastructure Security Agency
      - National Security Agency
      - Department of War
      - Department of State
      - Office of the Director of National Intelligence
      - Federal Acquisition Regulatory Council
      - Federal agencies
      - Critical infrastructure owners and operators
    domains:
      - Post-quantum cryptography
      - Cryptographic inventory
      - Federal cybersecurity
      - Critical infrastructure
      - Procurement
      - Cryptographic bill of materials
    objective: >-
      Coordinate the migration of federal information systems to NIST-approved post-quantum
      cryptography, establish accountable agency migration leadership and plans, accelerate
      validation and procurement, and help critical infrastructure operators prepare their own
      transitions.
    official_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
    related_missions:
      - QC-ADDS
    milestones:
      - id: federal-pqc-agency-leads
        title: Agencies identify and report their PQC migration leads
        target_date: 2026-07-22
        date_precision: exact
        status: monitoring
        summary: Executive Order 14412 gives each agency 30 days to identify a lead reporting to its chief information officer.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
      - id: federal-pqc-omb-guidance
        title: OMB issues agency guidance for inventories, migration plans, and high-impact systems
        target_date: 2026-09-20
        date_precision: exact
        status: planned
        summary: The order gives OMB 90 days to issue guidance in consultation with CISA and the National Cyber Director.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
      - id: federal-pqc-180-day-actions
        title: NIST, NSA, and the FAR Council complete the order's initial 180-day actions
        target_date: 2026-12-19
        date_precision: exact
        status: planned
        summary: Actions include starting a NIST migration pilot, reporting on National Security Systems, accelerating module validation, and proposing a PQC contractor rule.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
      - id: federal-pqc-270-day-actions
        title: CISA and the FAR Council publish cryptographic inventory and disclosure proposals
        target_date: 2027-03-19
        date_precision: exact
        status: planned
        summary: The order calls for public cryptographic bill of materials guidance and a proposed contractor vulnerability-disclosure rule.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
      - id: federal-pqc-nist-pilot
        title: Complete the NIST post-quantum cryptography migration pilot
        target_date: 2027-12-31
        date_precision: exact
        status: planned
        summary: The pilot covers an appropriate subset of NIST-owned or operated information systems.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
      - id: federal-pqc-key-establishment
        title: Transition federal high-value assets and high-impact systems to PQC key establishment
        target_date: 2030-12-31
        date_precision: exact
        status: planned
        summary: National Security Systems are excluded from this specific agency requirement and follow NSA-led processes.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
      - id: federal-pqc-digital-signatures
        title: Transition federal high-value assets and high-impact systems to PQC digital signatures
        target_date: 2031-12-31
        date_precision: exact
        status: planned
        summary: The deadline applies to the systems covered by the OMB guidance directed in Executive Order 14412.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/
    updates:
      - date: 2026-06-22
        kind: executive order
        title: Executive Order 14412 establishes the national federal PQC migration policy
        source: White House
        url: https://www.whitehouse.gov/presidential-actions/2026/06/securing-the-nation-against-advanced-cryptographic-attacks/

