  - name: "IonQ News"
    url: "https://www.ionq.com/news"
    entities: [IonQ]
  - name: "Quantinuum News"
    url: "https://www.quantinuum.com/news/news"
    entities: [Quantinuum]
  - name: "Rigetti News"
    url: "https://www.rigetti.com/news"
    entities: [Rigetti]
  - name: "SandboxAQ Blog"
    url: "https://www.sandboxaq.com/blog"
    entities: [SandboxAQ]
  - name: "Thales Cybersecurity Blog"
    url: "https://cpl.thalesgroup.com/blog"
