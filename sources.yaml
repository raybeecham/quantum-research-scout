settings:
  max_items_per_source: 40
  min_score: 3
  min_topic_confidence: 4
  report_top_n: 15
  report_limit_per_source: 5
  fuzzy_title_threshold: 0.92
  request_timeout_seconds: 20
  user_agent: "quantum-research-scout/0.1 (+https://github.com/raybeecham/quantum-research-scout)"

source_health:
  stale_after_days: 14
  critical_source_types: [federal_award, grant_opportunity, procurement]
  source_policies:
    NIST Post-Quantum Cryptography Project:
      role: reference
      note: "Standards/project reference; an older publication date is not a collection failure."
    IETF PQUIP:
      role: reference
      note: "Working-group reference; consult the linked drafts for revision dates."
    Deloitte Quantum Cyber Readiness:
      role: reference
      note: "Capability/reference material, not a dated news feed."
    Accenture Federal Services Quantum Readiness:
      role: reference
      note: "Federal quantum-readiness reference; separate Accenture collector tracks news."
    BSI Germany Quantum-Safe Guidance:
      role: reference
      note: "Long-lived official guidance; check the document version before citing."
    ENISA Cryptography and PQC:
      role: reference
      note: "Guidance hub, not daily news; older papers remain useful background."
    Intel Quantum Research:
      role: reference
      note: "Official research overview replaces the fixed 2023 chip announcement; not a news feed."
    Google Quantum AI:
      stale_after_days: 90
      note: "Focused research announcements publish less often than general news."
    AWS Quantum Technologies Blog:
      stale_after_days: 90
      note: "Specialist research/product blog; reviewed on a quarterly freshness window."
    NCSC UK Reports:
      stale_after_days: 180
      note: "Periodic reports; NCSC News provides the higher-frequency updates."

historical_backfill:
  lookback_days: 730
  max_items_per_source: 25
  include_undated: true

patents:
  enabled: true
  provider: "uspto_odp"
  endpoint: "https://api.uspto.gov/api/v1/patent/applications/search"
  api_key_env: "USPTO_ODP_API_KEY"
  max_items_per_query: 25
  queries:
    - name: "Post-Quantum Cryptography Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:"post quantum" OR
        applicationMetaData.inventionTitle:"post-quantum" OR
        applicationMetaData.inventionTitle:"quantum safe" OR
        applicationMetaData.inventionTitle:"quantum-safe" OR
        applicationMetaData.inventionTitle:"quantum resistant" OR
        applicationMetaData.inventionTitle:"quantum-resistant" OR
        applicationMetaData.inventionTitle:"ML-KEM" OR
        applicationMetaData.inventionTitle:"ML-DSA")
    - name: "Quantum Computing Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:"quantum computing" OR
        applicationMetaData.inventionTitle:"quantum processor" OR
        applicationMetaData.inventionTitle:qubit)
    - name: "Quantum Networking and Sensing Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:"quantum network" OR
        applicationMetaData.inventionTitle:"quantum communication" OR
        applicationMetaData.inventionTitle:"quantum sensing")
    - name: "Strategic AI Systems Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:"large language model" OR
        applicationMetaData.inventionTitle:"generative response engine" OR
        applicationMetaData.inventionTitle:"autonomous AI agent" OR
        applicationMetaData.inventionTitle:"stateful transformer")
    - name: "Cybersecurity and Cryptography Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:cybersecurity OR
        applicationMetaData.inventionTitle:"network security" OR
        applicationMetaData.inventionTitle:"zero trust" OR
        applicationMetaData.inventionTitle:ransomware OR
        applicationMetaData.inventionTitle:"malware detection" OR
        applicationMetaData.inventionTitle:"threat detection" OR
        applicationMetaData.inventionTitle:"identity and access management" OR
        applicationMetaData.inventionTitle:"secure access service edge" OR
        applicationMetaData.inventionTitle:"confidential computing" OR
        applicationMetaData.inventionTitle:"hardware security module")
    - name: "Cloud and Edge Infrastructure Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:"cloud computing" OR
        applicationMetaData.inventionTitle:"cloud security" OR
        applicationMetaData.inventionTitle:"hybrid cloud" OR
        applicationMetaData.inventionTitle:"multi-cloud" OR
        applicationMetaData.inventionTitle:"distributed cloud" OR
        applicationMetaData.inventionTitle:"edge computing" OR
        applicationMetaData.inventionTitle:"cloud orchestration" OR
        applicationMetaData.inventionTitle:"serverless computing" OR
        applicationMetaData.inventionTitle:"cloud workload")
    - name: "Distributed Sensing and Smart Dust Patents"
      search_query: >-
        (applicationMetaData.inventionTitle:"smart dust" OR
        applicationMetaData.inventionTitle:"distributed sensor network" OR
        applicationMetaData.inventionTitle:"microelectromechanical systems")
  curated:
    - publication_number: "US12400074B1"
      title: "Stateful pretrained transformers in a generative response engine"
      assignee: "OpenAI Opco LLC"
      inventors: ["Daniel Levine", "Rj Marsan", "Boyang Niu"]
      priority_date: "2025-02-25"
      filing_date: "2025-02-25"
      grant_date: "2025-08-26"
      publication_date: "2025-08-26"
      legal_status: "Active"
      priority: "high"
      score: 55
      topics: ["AI persistence", "Stateful models", "Agentic systems"]
      url: "https://patents.google.com/patent/US12400074B1/en"
      source: "Google Patents record with USPTO links"
      summary: "Stateful custom GPT systems can regenerate system prompts and persist configured values outside the model's contextual window."
      assessment: "Strategically relevant AI-state patent. It describes application memory and state transitions; the patent contains no shutdown-resistance or self-preservation claim."
    - publication_number: "US11354666B1"
      title: "Smart dust usage"
      assignee: "Wells Fargo Bank, N.A."
      inventors: ["Rameshchandra Bhaskar Ketharaju", "Sarath Chava", "Prasad N. Sivalanka", "Madhu V. Vempati"]
      priority_date: "2016-05-26"
      filing_date: "2016-05-26"
      grant_date: "2022-06-07"
      publication_date: "2022-06-07"
      legal_status: "Active"
      priority: "critical"
      score: 75
      topics: ["Smart dust", "Biometrics", "Distributed sensing"]
      url: "https://patents.google.com/patent/US11354666B1/en"
      source: "Google Patents record with USPTO links"
      summary: "Air-suspended or self-propelled MEMS motes collect images, audio, optical, location, motion, environmental, and biometric data for payment authentication."
      assessment: "High-impact sensing and privacy signal. The patent covers airborne smart-dust authentication, but a patent grant alone does not establish deployment or a general surveillance program."

federal_funding:
  enabled: true
  lookback_days: 1095
  retention_days: 1095
  usaspending:
    enabled: true
    endpoint: "https://api.usaspending.gov/api/v2/search/spending_by_award/"
    max_items_per_query: 20
  grants_gov:
    enabled: true
    endpoint: "https://api.grants.gov/v1/api/search2"
    statuses: "forecasted|posted"
    max_items_per_query: 20
  sam_gov:
    enabled: true
    endpoint: "https://api.sam.gov/opportunities/v2/search"
    api_key_env: "SAM_GOV_API_KEY"
    # One recent snapshot replaces one API request per keyword. All topic and
    # mission matching happens locally so a basic personal key stays under quota.
    collection_mode: "snapshot"
    lookback_days: 2
    max_items_per_request: 1000
    max_pages_per_run: 2
  document_intelligence:
    enabled: true
    max_opportunities: 20
    max_documents_per_opportunity: 4
    max_downloads_per_run: 3
    max_document_bytes: 8000000
    max_pdf_pages: 30
    max_text_characters: 80000
    refresh_days: 1
    # The public SAM.gov API exposes the latest active opportunity version.
    # Keep bounded tracker-observed evidence versions so later runs can explain changes.
    max_versions_per_document: 6
    max_opportunity_snapshots: 12
    amendment_similarity_threshold: 0.62
  contractor_enrichment:
    enabled: true
    endpoint: "https://api.sam.gov/entity-information/v4/entities"
    api_key_env: "SAM_GOV_API_KEY"
    max_contractors: 75
    max_entities_per_run: 3
    max_matches_per_query: 10
    cache_days: 30
  queries:
    - name: "Quantum Technologies"
      keyword: "quantum"
    - name: "Post-Quantum Cybersecurity"
      keyword: "post quantum"
      match_terms: ["post-quantum", "quantum safe", "quantum-safe", "PQC"]
    - name: "Artificial Intelligence"
      keyword: "artificial intelligence"
      match_terms: ["AI", "machine learning", "generative AI"]
    - name: "Cybersecurity"
      keyword: "cybersecurity"
    - name: "Advanced Computing"
      keyword: "high performance computing"
      match_terms: ["high-performance computing", "HPC", "advanced computing"]
    - name: "Autonomy and Sensing"
      keyword: "autonomous systems"
      match_terms: ["autonomy", "autonomous", "advanced sensing", "sensor"]
    - name: "Genesis Mission"
      keyword: "Genesis Mission"
      mission_ids: [genesis-mission]
    - name: "Golden Dome"
      keyword: "Golden Dome"
      mission_ids: [golden-dome]
    - name: "Quantum Genesis"
      keyword: "Quantum Genesis"
      mission_ids: [quantum-genesis]
    - name: "QC-ADDS"
      keyword: "QC-ADDS"
      mission_ids: [qc-adds]
    - name: "QuantumEAGLe"
      keyword: "QuantumEAGLe"
      mission_ids: [quantumeagle]
    - name: "Project Triad"
      keyword: "Project Triad"
      mission_ids: [project-triad]
    - name: "Quantum Benchmarking Initiative"
      keyword: "Quantum Benchmarking Initiative"
      mission_ids: [darpa-qbi]
    - name: "Military AI Pace-Setting Projects"
      keyword: "AI Pace-Setting Projects"
      mission_ids: [military-ai-pace-setting-projects]
    - name: "AI Forge"
      keyword: "AI Forge"
      mission_ids: [ai-forge]

arxiv:
  enabled: true
  fallback_only: true
  max_results: 25
  sort_by: submittedDate
  sort_order: descending
  request_pause_seconds: 4.0
  queries:
    - name: "arXiv PQC and Quantum-Safe Cryptography"
      search_query: 'cat:cs.CR AND (all:"post-quantum" OR all:"post quantum" OR all:"quantum-safe" OR all:"quantum resistant" OR all:"ML-KEM" OR all:"ML-DSA" OR all:"SLH-DSA" OR all:"Kyber" OR all:"Dilithium" OR all:"SPHINCS" OR all:"Falcon" OR all:"lattice cryptography")'
    - name: "arXiv Quantum Computing"
      search_query: 'cat:quant-ph AND (all:"fault tolerant" OR all:"fault-tolerant" OR all:"logical qubit" OR all:"quantum error correction" OR all:"QEC" OR all:"trapped ion" OR all:"superconducting" OR all:"neutral atom" OR all:"photonic")'
    - name: "arXiv Quantum Networking and Sensing"
      search_query: 'cat:quant-ph AND (all:"quantum network" OR all:"quantum networking" OR all:"quantum internet" OR all:"entanglement" OR all:"quantum sensing" OR all:"quantum sensor" OR all:"QKD")'

