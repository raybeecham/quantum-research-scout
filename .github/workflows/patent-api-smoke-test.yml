name: USPTO Patent API Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patent-api-smoke-test.yml"
      - "pqc_quantum_research_agent/collectors.py"
      - "scripts/check_patent_api.py"
      - "sources.yaml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patent-api:
    name: Validate configured patent searches
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install agent
        run: python -m pip install .

      - name: Run bounded USPTO query checks
        env:
          USPTO_ODP_API_KEY: ${{ secrets.USPTO_ODP_API_KEY }}
        run: python scripts/check_patent_api.py --config sources.yaml --max-items-per-query 3
