  - id: qc-adds
    name: QC-ADDS
    kind: national effort
    status: active
    phase: specifications and partnership planning
    priority: critical
    announcement_date: 2026-06-22
    aliases:
      - QC-ADDS
      - Quantum Computer for Application Development and Discovery Science
    lead_agencies:
      - White House Office of Science and Technology Policy
      - Department of Energy
    partners:
      - Department of Commerce
      - Department of War
      - National Science Foundation
      - Intelligence Community
      - NASA
      - NSA
      - Quantum industry
    domains:
      - Quantum computing
      - Scientific applications
      - Performance assessment
      - National security
      - Post-quantum cryptography
    objective: >-
      Pursue a quantum computer at a scale intended to initiate quantum-enabled scientific
      discovery, with the intent to deliver at least one system to a DOE facility and make it
      available to the scientific community to the extent possible.
    official_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
    related_missions:
      - Quantum Genesis
      - QuantumEAGLe
    milestones:
      - id: qc-adds-specifications
        title: Publish a summary of QC-ADDS technical specifications
        target_date: 2026-09-20
        date_precision: exact
        status: planned
        summary: DOE must identify specifications for transformative applications beyond current classical capabilities.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - id: qc-adds-partnership-model
        title: Explore private-sector partnership models and commercial contribution plans
        target_date: 2026-12-19
        date_precision: exact
        status: planned
        summary: The work covers potential cost, scope, time frame, and mechanisms such as advance market commitments.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - id: qc-adds-assessment-center
        title: Establish a national quantum-computing assessment center
        target_date: 2026-12-19
        date_precision: exact
        status: planned
        summary: The center is directed to develop tools for accurately assessing quantum-computing systems.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
      - id: qc-adds-security-report
        title: Report national-security implications of increasing commercial quantum capability
        target_date: 2027-06-22
        date_precision: exact
        status: planned
        summary: The assessment explicitly includes implications for migration to post-quantum cryptography.
        source_url: https://www.whitehouse.gov/presidential-actions/2026/06/ushering-in-the-next-frontier-of-quantum-innovation/
