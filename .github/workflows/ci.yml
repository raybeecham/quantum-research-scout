name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install --upgrade "ruff>=0.6"

      - name: Check lint rules
        run: ruff check --output-format github .

      - name: Check formatting
        run: ruff format --check --diff .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check dashboard formatting
        run: npx --yes prettier@3.9.6 --check "dashboard/*.{js,css,html}"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

  dashboard:
    name: Dashboard build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and browser checks
        run: python -m pip install -e ".[browser]"

      - name: Build static dashboard
        run: python scripts/build_dashboard.py --output site

      - name: Confirm the build produced the expected assets
        run: |
          for asset in index.html entity.html styles.css components.css desk.css app.js desk.js math.js entity.js favicon.svg data/dashboard.json vendor/katex-0.18.7/dist/katex.min.js vendor/katex-0.18.7/dist/katex.min.css vendor/katex-0.18.7/dist/fonts/KaTeX_Main-Regular.woff2; do
            test -s "site/$asset" || { echo "missing or empty: site/$asset"; exit 1; }
          done

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify the reading desk in a browser
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python scripts/verify_dashboard_browser.py --channel chromium

      - name: Keep browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-browser-checks
          path: site/verification/
          if-no-files-found: ignore
