name: Weekly PQC Quantum Research Synthesis

on:
  schedule:
    # Run at both possible 8:00 AM America/Chicago UTC offsets; the schedule gate
    # admits only the execution whose local hour is 08.
    - cron: "0 13,14 * * 5"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: America/Chicago

jobs:
  schedule-gate:
    name: Check Friday 8 AM Central window
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
    steps:
      - name: Resolve local schedule window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date +%u-%H)" = "5-08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  weekly-synthesis:
    name: Generate weekly synthesis
    needs: schedule-gate
    if: needs.schedule-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore research database cache
        uses: actions/cache@v5
        with:
          path: data/research_items.sqlite
          key: pqc-quantum-research-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pqc-quantum-research-db-${{ runner.os }}-

      - name: Install agent
        run: python -m pip install .

      - name: Capture Friday morning intelligence
        env:
          REPORTS_DIR: ${{ github.workspace }}/reports
        run: |
          mkdir -p "$REPORTS_DIR"
          pqc-quantum-research-agent \
            --config sources.yaml \
            --db data/research_items.sqlite \
            --reports-dir "$REPORTS_DIR" \
            --date "$(date +%F)" \
            --coverage-end-time "08:00"

      - name: Generate weekly synthesis
        env:
          REPORTS_DIR: ${{ github.workspace }}/reports
        run: |
          mkdir -p "$REPORTS_DIR/weekly"
          pqc-quantum-research-agent \
            --reports-dir "$REPORTS_DIR" \
            --weekly \
            --update-report-index

      - name: Commit generated weekly reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          if git diff --cached --quiet; then
            echo "No weekly report changes to commit"
          else
            git commit -m "Weekly PQC synthesis $(date +%F)"
            git push
          fi

      - name: Upload weekly synthesis
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-weekly-synthesis
          path: |
            reports/weekly/*-weekly.md
            reports/weekly/*/*-weekly.md
          if-no-files-found: error

      - name: Upload SQLite database
        uses: actions/upload-artifact@v7
        with:
          name: pqc-quantum-weekly-snapshot-db
          path: data/research_items.sqlite
          if-no-files-found: error
