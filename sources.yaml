    include_source_page: true
    include_patterns: [quantum, post-quantum, cryptograph, crypto-agil]
    match_patterns: [quantum, post-quantum, cryptograph, crypto-agil]
    max_items: 15
  - name: "Accenture Quantum and PQC News"
