name: Deploy Intelligence Dashboard

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "reports/**"
      - "scripts/build_dashboard.py"
      - "readiness.yaml"
      - "standards.yaml"
      - "missions.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_run:
    workflows:
      - "Daily PQC Quantum Research Scout"
      - "Weekly PQC Quantum Research Synthesis"
      - "Monthly PQC Quantum Research Synthesis"
      - "Weekly Historical Intelligence Backfill"
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static dashboard
        run: python scripts/build_dashboard.py --output site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
